<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>XEN — Soft Fade Up Reveal preview</title>
<style>*{box-sizing:border-box}body{margin:0;background:#dedede;color:#222;font:13px system-ui}header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 18px;background:#fff}h1{font-size:14px;margin:0 12px 0 0}button,select{font:inherit;padding:6px}main{overflow:auto;padding:14px;display:flex;justify-content:center}iframe{flex:none;border:0;background:#000;width:390px;height:800px}details{padding:8px 18px;background:#fff}pre{white-space:pre-wrap;max-height:300px;overflow:auto}#status{font-size:12px}</style>
<header><h1>Soft Fade Up Reveal</h1><label>ページ <select id="page"><option value="apparel">SHOP</option><option value="creator">CREATOR</option><option value="index">INDEX</option><option value="studio">STUDIO</option><option value="storybooks">STORYBOOKS</option><option value="animation">ANIMATION</option><option value="sound">SOUND</option><option value="cinematic">CINEMATIC</option><option value="snap">PHOTOGRAPHY</option><option value="design">DESIGN</option><option value="architecture">ARCHITECTURE</option><option value="space">SPACE</option><option value="artworks">ARTWORKS</option><option value="sns-management">SNS MANAGEMENT</option><option value="price-list">PRICE LIST</option></select></label><label>幅 <select id="width"><option>390</option><option>320</option><option>768</option><option>1280</option></select></label><button id="top">先頭</button><button id="products">商品</button><button id="films">動画</button><button id="fields">活動領域</button><button id="inspect">現在の画面を検査</button><button id="audit">全15ページ検査</button><span id="status" role="status">読み込み中</span></header>
<main><iframe id="preview" title="公開サイトのレスポンシブ表示" src="./apparel.html?qa=soft-reveal1"></iframe></main><details open><summary>検証結果</summary><pre id="results"></pre></details>
<script>
(() => {
 'use strict';
 const frame=document.querySelector('#preview'),page=document.querySelector('#page'),width=document.querySelector('#width'),status=document.querySelector('#status'),out=document.querySelector('#results');
 const pages=[...page.options].map(x=>x.value);
 function view(){frame.style.width=width.value+'px';frame.src='./'+page.value+'.html?qa=soft-reveal1';status.textContent='読み込み中';}
 function inspect(){
  const d=frame.contentDocument,w=frame.contentWindow;
  const cards=[...d.querySelectorAll('.base-product,.work,.sound-release-card,.studio-service-link,.mvv-detail,.cp-facts,.cp-facts > div,.cp-field-entry,.cp-field-detail,.gallery-description-card,.design-description,.arch-project,.space-feature,.sns-metrics,.sns-process-list > li,.sns-fit,.price-category-nav > a,.price-card,.support-shell')];
  const framed=cards.filter(n=>{const s=w.getComputedStyle(n);return ['Top','Right','Bottom','Left'].some(k=>parseFloat(s['border'+k+'Width'])>0&&s['border'+k+'Style']!=='none')}).map(n=>n.className);
  return {page:page.value,width:w.innerWidth,overflow:d.documentElement.scrollWidth>w.innerWidth,oldTraceNodes:d.querySelectorAll('.xen-gold-trace,[data-gold-trace-active]').length,oldResources:[...d.querySelectorAll('script[src],link[href]')].filter(n=>/xen-gold-border/.test(n.src||n.href)).length,revealTargets:d.querySelectorAll('[data-ql-motion="soft-fade-up"]').length,cardCount:cards.length,framedCards:framed,profileFacts:d.querySelectorAll('.cp-facts > div').length,creativeFields:d.querySelectorAll('.cp-field-entry').length,profileColumns:d.querySelector('.cp-facts')?w.getComputedStyle(d.querySelector('.cp-facts')).gridTemplateColumns:null,products:d.querySelectorAll('.base-product').length,videos:[...d.querySelectorAll('.video-container')].map(n=>{const r=n.getBoundingClientRect();return {ratio:r.height?Number((r.width/r.height).toFixed(3)):null}})};
 }
 frame.addEventListener('load',()=>{status.textContent=page.value+' · '+width.value+'px';});
 page.addEventListener('change',view);width.addEventListener('change',()=>{frame.style.width=width.value+'px';status.textContent=page.value+' · '+width.value+'px';});
 function jump(selector){frame.contentDocument.querySelector(selector)?.scrollIntoView({block:'start',behavior:'instant'});}
 document.querySelector('#top').onclick=()=>frame.contentWindow.scrollTo({top:0,behavior:'instant'});
 document.querySelector('#products').onclick=()=>jump('.base-products');document.querySelector('#films').onclick=()=>jump('.work');document.querySelector('#fields').onclick=()=>jump('.cp-fields-section');
 document.querySelector('#inspect').onclick=()=>out.textContent=JSON.stringify(inspect(),null,2);
 document.querySelector('#audit').onclick=async()=>{
  const result=[];document.querySelector('#audit').disabled=true;
  try{for(const size of [1280,390,320])for(const name of pages){
   width.value=String(size);page.value=name;
   await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(new Error('Load timeout: '+name)),20000);frame.addEventListener('load',()=>{clearTimeout(timer);resolve();},{once:true});view();});
   await new Promise(resolve=>setTimeout(resolve,900));
   const row=inspect();result.push(row);out.textContent=JSON.stringify(result,null,2);status.textContent=result.length+'/45';
  }}catch(error){status.textContent=error.message;}finally{document.querySelector('#audit').disabled=false;}
 };
})();
</script></html>
