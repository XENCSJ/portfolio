<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>XEN INDEX — 5 SETS PREVIEW</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#f5f5f5;font:14px Arial,sans-serif}header{padding:22px 24px 16px;border-bottom:1px solid #302a20}h1{font-size:18px;letter-spacing:.12em;margin:0 0 12px}p{color:#aaa;line-height:1.8;margin:8px 0}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,select,a{font:inherit}button,select{background:#111;color:#eee;border:1px solid #645338;border-radius:2px;padding:10px 12px;cursor:pointer}button[aria-pressed=true]{background:#c5a059;color:#080808}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #c5a059;outline-offset:3px}#status{display:inline-block;color:#c5a059;margin-left:8px}.viewport{display:flex;justify-content:center;margin:0 auto;max-width:100%;overflow:auto}iframe{display:block;flex-shrink:0;width:100%;height:850px;border:0;background:#000}.note{font-size:12px}a{color:#d6b577}
</style>
</head>
<body>
<header>
<h1>XEN INDEX / 5 SETS</h1>
<div class="controls" aria-label="アニメーション選択">
<button type="button" data-set="1" aria-pressed="true">01 ORIGINAL</button>
<button type="button" data-set="2" aria-pressed="false">02 SEQUENTIAL TRACE</button>
<button type="button" data-set="3" aria-pressed="false">03 SOFT REVEAL</button>
<button type="button" data-set="4" aria-pressed="false">04 REVERSE TRACE</button>
<button type="button" data-set="5" aria-pressed="false">05 DUAL REVEAL</button>
<button type="button" id="replay">再生し直す</button>
<label>表示幅 <select id="width"><option value="fluid">画面に合わせる</option><option value="390">スマートフォン 390px</option><option value="430">スマートフォン 430px</option><option value="1440">PC 1440px</option></select></label>
</div>
<p id="status" role="status">SET 01 | ORIGINAL</p>
<p class="note">本番のINDEXを固定セットで再読み込みします。再生中の切り替えは新しいページ表示として開始します。端末の「視差効果を減らす」が有効な場合は完成状態を表示します。<br>SET 01の元の回転・タップ再生を維持。SET 05は15項目を近い対向7組と最後の1項目で表示します。<a href="./index.html">本番INDEXへ</a></p>
</header>
<div class="viewport"><iframe id="preview" title="XEN INDEX 実際のアニメーション" src="./index.html?xen-preview-set=1"></iframe></div>
<script>
(() => {
 const frame=document.getElementById('preview'),buttons=[...document.querySelectorAll('[data-set]')];
 let chosen='1',sequence=0;
 function replay(){frame.src='./index.html?xen-preview-set='+chosen+'&preview-replay='+(++sequence);}
 buttons.forEach(button=>button.addEventListener('click',()=>{
   chosen=button.dataset.set;
   buttons.forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
   document.getElementById('status').textContent='SET '+button.textContent;
   replay();
 }));
 document.getElementById('replay').addEventListener('click',replay);
 document.getElementById('width').addEventListener('change',event=>{
   frame.style.width=event.target.value==='fluid'?'100%':event.target.value+'px';
   replay();
 });
})();
</script>
</body></html>
