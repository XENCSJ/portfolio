name: INDEX sitemap verification
on:
  push:
    branches: ['work/index-two-column-20261026', 'main']
    paths: ['index.html', 'xen-ui.css', 'verify-index-sitemap.cjs', '.github/workflows/index-entry-qa.yml']
  workflow_dispatch:
    inputs:
      published:
        description: Test the published GitHub Pages site
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  index-sitemap:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1 http-server@14.1.1
      - name: Prepare comparison and serve repository
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --depth=1 origin 077aa08fd01c731185cbff3cc73da601fadae4bd
          git show 077aa08fd01c731185cbff3cc73da601fadae4bd:index.html > __baseline-index.html
          git show 077aa08fd01c731185cbff3cc73da601fadae4bd:xen-ui.css > __baseline-ui.css
          sed -i 's|./xen-ui.css?v=20261026-sitemap1|./__baseline-ui.css|' __baseline-index.html
          npx http-server . -p 8765 -c-1 > /tmp/index-sitemap-server.log 2>&1 &
      - name: Verify responsive sitemap and preserved INDEX behavior
        env:
          PUBLISHED: ${{ inputs.published || github.ref == 'refs/heads/main' }}
        run: node verify-index-sitemap.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: index-two-column-evidence
          path: index-two-column-evidence/
          retention-days: 14
