name: MUSIC editorial navigation verification
on:
  push:
    branches: [work/music-navigation-20261025]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Published site base URL; empty tests this checkout'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify all genres, scroll destinations and eight viewport widths
        env:
          MUSIC_BASE_URL: ${{ inputs.base_url }}
        run: node --check xen-music-navigation.js && node verify-music-navigation.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: music-navigation-browser-evidence
          path: music-navigation-qa/
          retention-days: 14
