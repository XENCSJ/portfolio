name: STUDIO first-view verification
on:
  pull_request:
    paths: [studio.html, 'xen-studio-fusion.*', verify-studio-fusion.cjs, .github/workflows/studio-fusion-qa.yml]
  workflow_dispatch:
    inputs:
      public_url:
        description: 'Optional deployed STUDIO URL'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node --check xen-studio-fusion.js && node verify-studio-fusion.cjs
        env:
          FUSION_PUBLIC_URL: ${{ inputs.public_url }}
          FUSION_BASE_SHA: ${{ github.event.pull_request.base.sha || 'HEAD^' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-firstview-evidence
          path: fusion-qa/
          retention-days: 14
