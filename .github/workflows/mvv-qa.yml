name: MVV pyramid verification
on:
  push:
    branches: [work/mvv-pyramid-20261020]
  pull_request:
    paths: [studio.html, 'xen-mvv-pyramid.*', verify-mvv.cjs, .github/workflows/mvv-qa.yml]
  workflow_dispatch:
    inputs:
      public_url:
        description: 'Optional deployed STUDIO URL for public verification'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node --check xen-mvv-pyramid.js && node verify-mvv.cjs
        env:
          MVV_PUBLIC_URL: ${{ inputs.public_url }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mvv-browser-evidence
          path: mvv-qa/
          retention-days: 14
