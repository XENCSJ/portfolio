name: APPAREL editorial verification
on:
  push:
    paths: ['apparel.html', 'xen-apparel-seamless.css', 'xen-apparel-hoodie-back.jpeg', 'verify-apparel-editorial.cjs', '.github/workflows/apparel-editorial-qa.yml']
  workflow_dispatch:
    inputs:
      public_url:
        description: Public site base URL, or empty for checkout
        type: string
        required: false
permissions:
  contents: read
jobs:
  editorial:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: git fetch --depth=1 origin 64b75904b9cceb618339ddcb6c276ede42580d78
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node verify-apparel-editorial.cjs
        env:
          APPAREL_PUBLIC_URL: ${{ inputs.public_url }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apparel-editorial-evidence
          path: apparel-editorial-qa/
          retention-days: 14
