name: Image caption verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/image-caption-qa.yml']
permissions:
  contents: read
jobs:
  published:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [desktop, android, iphone, safari]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Wait for the published caption update
        run: |
          for attempt in $(seq 1 36); do
            if curl -fsSL "https://xencsj.github.io/portfolio/design.html?caption-check=$GITHUB_RUN_ID-$attempt" | grep -q '20261023-image-only1'; then exit 0; fi
            sleep 5
          done
          echo 'Published caption update was not found.' >&2
          exit 1
      - name: Verify all fifteen published pages
        run: node verify-image-captions.cjs
        env:
          CAPTION_PROFILE: ${{ matrix.profile }}
          CAPTION_PUBLIC_URL: https://xencsj.github.io/portfolio/
          CAPTION_REQUIRE_EXTERNAL: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-caption-${{ matrix.profile }}
          path: image-caption-qa/
          retention-days: 14
