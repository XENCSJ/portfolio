name: MUSIC reader verification
on:
  push:
    branches: [main, work/music-reader-restore-20261028]
    paths: ['*.html', '*.css', '*.js', verify-music-reader.cjs, MUSIC_READER.md, .github/workflows/music-reader-qa.yml]
  pull_request:
    paths: ['*.html', '*.css', '*.js', verify-music-reader.cjs, MUSIC_READER.md, .github/workflows/music-reader-qa.yml]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Published site base URL; leave empty to test this checkout'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Check fixed headings, independent text scrolling and all eight releases
        env:
          MUSIC_BASE_URL: ${{ inputs.base_url }}
        run: node --check xen-music-reader.js && node verify-music-reader.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: music-reader-browser-evidence
          path: music-reader-qa/
          retention-days: 14
  published:
    needs: browser
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Verify deployed bytes and operate every published reader
        env:
          MUSIC_BASE_URL: https://xencsj.github.io/portfolio
          MUSIC_WAIT_FOR_DEPLOY: 'true'
        run: node verify-music-reader.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: music-reader-published-evidence
          path: music-reader-qa/
          retention-days: 14
