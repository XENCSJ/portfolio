name: Discovery random visit verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  published:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Check published desktop and mobile randomization
        env:
          DISCOVERY_BROWSER_CHECK: '1'
        run: node verify-discovery-random.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-random-evidence
          path: discovery-random-evidence/
          retention-days: 7
