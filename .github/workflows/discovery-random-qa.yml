name: Discovery random visit verification
on:
  push:
    branches: [main, work/index-discovery-20261028]
    paths: [index.html, what-is-xen.html, xen-discovery-gallery.js, xen-discovery-gallery.json, verify-discovery-random.cjs, .github/workflows/discovery-random-qa.yml]
  pull_request:
    paths: [index.html, what-is-xen.html, xen-discovery-gallery.js, xen-discovery-gallery.json, verify-discovery-random.cjs, .github/workflows/discovery-random-qa.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Serve checkout
        run: python3 -m http.server 8765 > /tmp/discovery-http.log 2>&1 &
      - name: Check INDEX subtitle and discovery exclusions on desktop and mobile
        env:
          DISCOVERY_BROWSER_CHECK: '1'
        run: node --check xen-discovery-gallery.js && node verify-discovery-random.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-random-evidence
          path: discovery-random-evidence/
          retention-days: 7
  published:
    needs: browser
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Verify deployed files and published reloads, revisits and popups
        env:
          DISCOVERY_BROWSER_CHECK: '1'
          DISCOVERY_BASE_URL: https://xencsj.github.io/portfolio/
          DISCOVERY_WAIT_FOR_DEPLOY: 'true'
        run: node verify-discovery-random.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-random-published-evidence
          path: discovery-random-evidence/
          retention-days: 7
