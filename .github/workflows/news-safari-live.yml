name: Verify published NEWS in Safari
on:
  push:
    branches: [news-archive-20261103]
    paths: ['.github/workflows/news-safari-live.yml']
  workflow_dispatch:
permissions: {}
jobs:
  safari:
    runs-on: macos-26-intel
    timeout-minutes: 10
    steps:
      - name: Enable the installed Safari driver
        run: |
          sudo /usr/bin/safaridriver --enable
          /usr/bin/safaridriver --version
          open -a Safari https://xencsj.github.io/portfolio/news.html || true
          python3 -m venv "$RUNNER_TEMP/news-safari"
          "$RUNNER_TEMP/news-safari/bin/python" -m pip install -q selenium
      - name: Check the public NEWS pages in native Safari
        id: desktop
        continue-on-error: true
        run: |
          "$RUNNER_TEMP/news-safari/bin/python" - <<'PY'
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.safari.service import Service
          from selenium.webdriver.support.ui import WebDriverWait

          base = "https://xencsj.github.io/portfolio/"
          with webdriver.Safari(service=Service(executable_path="/usr/bin/safaridriver")) as browser:
              print("Browser", browser.capabilities["browserName"], browser.capabilities["browserVersion"], flush=True)
              browser.set_window_size(1280, 900)
              wait = WebDriverWait(browser, 25)
              browser.get(base + "news.html")
              first_titles = ["渋谷ハロウィン2026｜100人と交流するまで帰れません", "『途中のままで』Music Video公開"]
              assert browser.find_element(By.TAG_NAME, "h1").is_displayed()
              dates = []
              for page, count in enumerate([10, 10, 1], start=1):
                  wait.until(lambda b: b.find_element(By.CSS_SELECTOR, ".news-pages [aria-current]").text == str(page))
                  rows = browser.find_elements(By.CSS_SELECTOR, "#news-list li")
                  assert len(rows) == count
                  for index, row in enumerate(rows):
                      card = row.find_element(By.CSS_SELECTOR, "a.news-card")
                      title = card.find_element(By.CSS_SELECTOR, ".news-title")
                      assert title.is_displayed() and title.text.strip()
                      if page == 1 and index < len(first_titles):
                          assert title.text.strip() == first_titles[index], title.text
                      dates.append(card.find_element(By.TAG_NAME, "time").get_attribute("datetime"))
                      img = card.find_element(By.TAG_NAME, "img")
                      browser.execute_script("arguments[0].scrollIntoView({block:'center'})", img)
                      wait.until(lambda b: b.execute_script("return arguments[0].complete && arguments[0].naturalWidth > 0", img))
                      assert browser.execute_script("""
                          const thumb = arguments[0].parentElement.getBoundingClientRect();
                          const copy = arguments[1].getBoundingClientRect();
                          return Math.abs(thumb.width / thumb.height - 16/9) < .01 &&
                                 copy.left > thumb.right && copy.right <= innerWidth &&
                                 document.documentElement.scrollWidth <= innerWidth;
                      """, img, title)
                  assert len(browser.find_elements(By.CSS_SELECTOR, "footer .xen-footer-actions a")) == 2
                  print(f"PASS Safari page {page}: {count} cards, artwork, text, layout, footer", flush=True)
                  if page < 3:
                      browser.find_element(By.CSS_SELECTOR, ".news-pages [rel=next]").click()
              assert dates == sorted(dates, reverse=True)
              browser.find_element(By.CSS_SELECTOR, ".news-pages [rel=prev]").click()
              wait.until(lambda b: b.current_url.endswith("news-2.html#news-list"))
              browser.get(base + "news.html")
              wait.until(lambda b: b.find_element(By.CSS_SELECTOR, ".news-card img").get_property("naturalWidth") > 0)
              browser.save_screenshot("published-news-safari.png")
          PY
      - name: Check the published pages in iPhone Simulator Safari if desktop automation is unavailable
        if: steps.desktop.outcome == 'failure'
        run: |
          set -euo pipefail
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(v["udid"] for k in sorted(d,reverse=True) if "iOS-" in k for v in d[k] if "iPhone" in v["name"]))')
          xcrun simctl boot "$SIM_ID"
          xcrun simctl bootstatus "$SIM_ID" -b
          cat > "$RUNNER_TEMP/read-screen.swift" <<'SWIFT'
          import Foundation
          import Vision
          let request = VNRecognizeTextRequest()
          request.recognitionLevel = .accurate
          request.recognitionLanguages = ["ja-JP","en-US"]
          let handler = VNImageRequestHandler(url: URL(fileURLWithPath: CommandLine.arguments[1]))
          try handler.perform([request])
          for block in request.results ?? [] {
              print(block.topCandidates(1).first?.string ?? "")
          }
          SWIFT
          swiftc "$RUNNER_TEMP/read-screen.swift" -o "$RUNNER_TEMP/read-screen"
          for n in 1 2 3; do
            case "$n" in
              1) file=news.html; label='2026.11.0[12]|渋谷ハロウィン|途中のままで' ;;
              2) file=news-2.html; label='2026.10.19|2026.10.16|アートワーク|サンリオ' ;;
              3) file=news-3.html; label='2025.07.16|ストリート|ラグジュアリー' ;;
            esac
            xcrun simctl openurl "$SIM_ID" "https://xencsj.github.io/portfolio/$file"
            for attempt in 1 2 3 4 5; do
              sleep 4
              xcrun simctl io "$SIM_ID" screenshot "published-news-iphone-$n.png"
              "$RUNNER_TEMP/read-screen" "published-news-iphone-$n.png" > "$RUNNER_TEMP/visible.txt"
              if grep -Eq "$label" "$RUNNER_TEMP/visible.txt"; then break; fi
            done
            cat "$RUNNER_TEMP/visible.txt"
            grep -Eq "$label" "$RUNNER_TEMP/visible.txt"
            echo "PASS iPhone Safari displayed the actual article on published NEWS page $n"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-news-native-safari
          path: published-news-*.png
