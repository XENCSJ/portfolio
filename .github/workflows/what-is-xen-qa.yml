name: WHAT IS XEN verification
on:
  push:
    branches: ['work/what-is-xen-20261026', 'work/what-is-xen-mosaic-20261026']
    paths: ['what-is-xen.html', 'xen-discovery*', 'xen-channels*', 'xen-channel-*', 'verify-discovery.cjs', '.github/workflows/what-is-xen-qa.yml']
  pull_request:
    paths: ['what-is-xen.html', 'xen-discovery*', 'xen-channels*', 'xen-channel-*', 'verify-discovery.cjs', '.github/workflows/what-is-xen-qa.yml']
  workflow_dispatch:
    inputs:
      published:
        description: Test the published GitHub Pages site
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  discovery:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1 http-server@14.1.1
      - name: Serve repository
        if: ${{ !inputs.published }}
        run: npx http-server . -p 8765 -c-1 > /tmp/discovery-server.log 2>&1 &
      - name: Verify exploration and integration
        env:
          DISCOVERY_BASE_URL: ${{ inputs.published && 'https://xencsj.github.io/portfolio/' || 'http://127.0.0.1:8765/' }}
        run: node verify-discovery.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: what-is-xen-evidence
          path: discovery-evidence/
          retention-days: 14
