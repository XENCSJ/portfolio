name: CINEMATIC published page preview
on:
  push:
    branches: ['work/cinematic-preview-20261022']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Capture the published page at desktop and phone widths
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const { chromium, webkit } = require('playwright');
          (async () => {
            fs.mkdirSync('cinematic-preview', { recursive: true });
            const evidence = [];
            for (const [label, engine, width, height] of [['PC', chromium, 1440, 1000], ['mobile', webkit, 390, 844], ['small-mobile', chromium, 320, 812]]) {
              const browser = await engine.launch();
              const page = await browser.newPage({ viewport: { width, height }, deviceScaleFactor: 1 });
              await page.goto('https://xencsj.github.io/portfolio/cinematic.html?preview=' + Date.now(), { waitUntil: 'networkidle' });
              await page.locator('.cinematic-copy > h3').first().waitFor();
              for (const item of await page.locator('.cinematic-work').all()) {
                await item.scrollIntoViewIfNeeded();
                await page.waitForTimeout(1000);
              }
              await page.evaluate(() => scrollTo({top: 0, behavior: 'instant'}));
              await page.waitForTimeout(1200);
              const layout = await page.locator('.cinematic-work').evaluateAll(items => items.map(item => {
                const title = item.querySelector('h3'), duration = item.querySelector('.cinematic-duration'), video = item.querySelector('.video-container');
                const t = title.getBoundingClientRect(), d = duration.getBoundingClientRect(), v = video.getBoundingClientRect(), s = getComputedStyle(title), image = video.querySelector('img');
                return { title: title.textContent, duration: duration.textContent, size: s.fontSize, weight: s.fontWeight, alignment: s.textAlign, leftDifference: t.left-v.left, rightDifference: d.right-v.right, titleDurationGap: d.left-t.right, titleHeight: t.height, videoWidth:v.width, videoHeight:v.height, thumbnailLoaded:!!image?.naturalWidth, thumbnailSource:image?.src };
              }));
              await page.screenshot({ path: 'cinematic-preview/XEN-CINEMATIC-' + label + '.png', fullPage: true });
              const playback = [];
              for (let i=0; i<4; i++) {
                await page.locator('.cinematic-work').nth(i).locator('.xen-cinema-cover').click();
                await page.waitForTimeout(6000);
                playback.push(await page.locator('.cinematic-work').nth(i).evaluate(item => ({ title:item.querySelector('h3').textContent, frame:item.querySelector('.video-container > iframe')?.getAttribute('src'), status:item.querySelector('.video-container > iframe')?.dataset.playbackStatus, api:item.querySelector('.video-container > iframe')?.dataset.apiStatus, error:item.querySelector('.xen-cinema-error')?.textContent })));
              }
              evidence.push({label, width, layout, playback, descriptions: await page.locator('.cinematic-subtitle,.cinematic-description').count()});
              await browser.close();
            }
            fs.writeFileSync('cinematic-preview/measurements.json', JSON.stringify(evidence,null,2));
            console.log(JSON.stringify(evidence,null,2));
          })().catch(error=>{console.error(error);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinematic-published-preview
          path: cinematic-preview/
          retention-days: 14
