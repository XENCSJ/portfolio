name: Update verified NEWS

on:
  workflow_run:
    workflows: [pages-build-deployment]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths: ['*.html', '*.json', 'news.py', 'sync_works.py', 'test_news*', 'test_sync_works.py', 'xen-news.*', '.github/workflows/news.yml']

permissions:
  contents: read

concurrency:
  group: xen-news-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Generate first: source edits are not required to include generated NEWS.
      - run: python news.py
      - run: python -m unittest -v test_news.py test_sync_works.py
      - run: python sync_works.py
      - run: node --check xen-news.js

  browser-checks:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python news.py
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Check desktop and mobile NEWS and song anchor
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/news-http.log 2>&1 &
          node verify-news-works.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-browser-checks
          path: news-qa/

  refresh:
    needs: checks
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      deployments: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize published works and generate NEWS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python sync_works.py --refresh
          python -m unittest -v test_news.py test_sync_works.py
          python news.py --check
      - name: Commit synchronized work identities and NEWS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=(works.json news-events.json news-archive.json index.html studio.html creator.html storybooks.html animation.html sound.html cinematic.html snap.html design.html apparel.html architecture.html space.html artworks.html sns-management.html price-list.html)
          if git diff --quiet -- "${files[@]}"; then
            echo 'No new work or publication-state change; no commit needed.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${files[@]}"
          git commit -m 'NEWS: synchronize published works automatically'
          # Do not rebase generated snapshots over newer content. Retry on its
          # successful Pages event; an ordinary push also rejects concurrent writes.
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          git push origin HEAD:main
          build_url=$(gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq .url)
          for attempt in $(seq 1 36); do
            state=$(gh api "$build_url" --jq .status)
            if [ "$state" = built ]; then
              echo 'Published works, NEWS and anchors are synchronized.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$state" = errored ]; then exit 1; fi
            sleep 10
          done
          echo 'Pages publication was not confirmed in time.' >&2
          exit 1
