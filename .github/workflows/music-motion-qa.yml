name: MUSIC shared motion
on:
  push:
    branches: [main, work/music-shared-motion-20261026]
    paths: [sound.html, xen-sound.css, xen-immersive.js, verify-music-motion.cjs, verify-header-logo.cjs, xen-header.css, .github/workflows/music-motion-qa.yml]
  pull_request:
    paths: [sound.html, xen-sound.css, xen-immersive.js, verify-music-motion.cjs, verify-header-logo.cjs, xen-header.css, .github/workflows/music-motion-qa.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node --check xen-immersive.js && node verify-header-logo.cjs && node verify-music-motion.cjs
      - run: node verify-music-reader.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: music-motion-evidence
          path: |
            header-logo-qa/
            music-motion-qa/
            music-reader-qa/
          retention-days: 14
  published:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node verify-music-motion.cjs && node verify-header-logo.cjs
        env:
          MUSIC_BASE_URL: https://xencsj.github.io/portfolio
          MUSIC_WAIT_FOR_DEPLOY: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: music-motion-published-evidence
          path: |
            music-motion-qa/
            header-logo-qa/
          retention-days: 14
