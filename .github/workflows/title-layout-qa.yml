name: Page title and layout verification
on:
  pull_request:
    paths: ['*.html', 'xen-page-titles.css', 'xen-detail-refined.css', 'xen-creator.css', 'xen-sound.css', 'xen-studio-fusion.css', 'verify-category-titles.cjs', '.github/workflows/title-layout-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify all 15 pages at the five requested widths
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/title-http.log 2>&1 &
          node verify-category-titles.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: title-layout-evidence
          path: news-qa/
          retention-days: 14
