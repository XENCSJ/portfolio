name: Public naming verification
on:
  push:
    branches: [work/unify-public-names-20261027]
  workflow_dispatch:
    inputs:
      public_url:
        description: Public base URL, or empty for checkout
        type: string
        required: false
permissions:
  contents: read
jobs:
  naming:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/names-http.log 2>&1 &
      - run: node verify-public-names.cjs
        env:
          NAMES_BASE_URL: ${{ inputs.public_url }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-names-evidence
          path: names-qa/
          retention-days: 14
