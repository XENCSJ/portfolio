name: Motion browser verification
on:
  push:
    branches: [work/site-motion-20261020]
  pull_request:
    paths: ['xen-immersive.*', 'verify-motion.cjs', '.github/workflows/motion-qa.yml']
  workflow_dispatch:
    inputs:
      public_url:
        description: Public site base URL (leave empty for local regression)
        required: false
        type: string
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node --check xen-immersive.js && node verify-motion.cjs
        env:
          MOTION_BASE_URL: ${{ inputs.public_url }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motion-browser-evidence
          path: motion-qa/
          retention-days: 14
